[package]
name = "vec-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "vec MCP server for AI assistant integration"
license.workspace = true
repository.workspace = true

[dependencies]
vec-core  = { path = "../vec-core" }
vec-embed = { path = "../vec-embed" }
vec-store = { path = "../vec-store", default-features = false }
rmcp      = { version = "3", features = ["server", "transport-io"] }
tokio     = { version = "1", features = ["rt-multi-thread", "macros"] }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
anstream  = "0.6"
anyhow    = "1"

[dev-dependencies]
vec-store = { path = "../vec-store", features = ["bundled-sqlite"] }
