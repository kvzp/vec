[package]
name = "vec-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "vec file walker, chunker, and incremental indexer"
license.workspace = true
repository.workspace = true

[dependencies]
vec-core  = { path = "../vec-core" }
vec-embed = { path = "../vec-embed" }
vec-store = { path = "../vec-store", default-features = false }
ignore    = "0.4"
sha2      = "0.10"
hex       = "0.4"
rayon     = "1.10"
anyhow    = "1"

[dev-dependencies]
vec-store = { path = "../vec-store", features = ["bundled-sqlite"] }
tempfile = "3"
