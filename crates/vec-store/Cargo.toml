[package]
name = "vec-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "vec SQLite storage and cosine similarity search"
license.workspace = true
repository.workspace = true

[dependencies]
rusqlite = { version = "0.43", features = ["fallible_uint"] }
anstream = "0.6"
anyhow   = "1"
vec-core  = { path = "../vec-core" }
vec-embed = { path = "../vec-embed" }

[dev-dependencies]
tempfile = "3"

[features]
# Exactly one SQLite source must be selected:
#   bundled-sqlite (default) compiles SQLite into the binary;
#   system-sqlite links the system libsqlite3 (distro packages) and needs
#   --no-default-features, so that bundled-sqlite is off.
default        = ["bundled-sqlite"]
bundled-sqlite = ["rusqlite/bundled"]
system-sqlite  = []
