[package]
name = "vec-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "vec CLI binary — semantic file search"
license.workspace = true
repository.workspace = true

[[bin]]
name = "vec"
path = "src/main.rs"

[features]
# SQLite source, see vec-store. Distro packages:
#   cargo build --release -p vec-cli --no-default-features --features system-sqlite
default        = ["bundled-sqlite"]
bundled-sqlite = ["vec-store/bundled-sqlite"]
system-sqlite  = ["vec-store/system-sqlite"]

[dependencies]
vec-core   = { path = "../vec-core" }
vec-embed  = { path = "../vec-embed" }
vec-store  = { path = "../vec-store", default-features = false }
vec-index  = { path = "../vec-index" }
vec-query  = { path = "../vec-query" }
vec-watch  = { path = "../vec-watch" }
vec-daemon = { path = "../vec-daemon" }
vec-mcp    = { path = "../vec-mcp" }
clap           = { version = "4", features = ["derive"] }
clap_complete  = "4"
tokio      = { version = "1", features = ["rt-multi-thread"] }
anyhow     = "1"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[dev-dependencies]
tempfile = "3"
