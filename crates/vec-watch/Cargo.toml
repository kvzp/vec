[package]
name = "vec-watch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "vec real-time inotify filesystem watcher"
license.workspace = true
repository.workspace = true

[dependencies]
vec-core  = { path = "../vec-core" }
vec-embed = { path = "../vec-embed" }
vec-index = { path = "../vec-index" }
vec-store = { path = "../vec-store", default-features = false }
notify    = "6"
anstream  = "0.6"
anyhow    = "1"

[target.'cfg(unix)'.dependencies]
libc                 = "0.2"
nix                  = { version = "0.29", features = ["fs"] }
signal-hook-registry = "1.4"

[dev-dependencies]
vec-store = { path = "../vec-store", features = ["bundled-sqlite"] }
tempfile = "3"
