[package]
name = "vec-watch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "vec real-time inotify filesystem watcher"
license.workspace = true
repository.workspace = true

[dependencies]
vec-core  = { path = "../vec-core" }
vec-embed = { path = "../vec-embed" }
vec-index = { path = "../vec-index" }
vec-store = { path = "../vec-store", default-features = false }
notify    = "6"
anstream  = "0.6"
anyhow    = "1"

[dev-dependencies]
vec-store = { path = "../vec-store", features = ["bundled-sqlite"] }
tempfile = "3"
